version: '3.8'

services:
  db:
    image: postgres:15.15-trixie
    container_name: brasilcard_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - brasilcard_network
    restart: always

volumes:
  pgdata:

networks:
  brasilcard_network:
    driver: bridge