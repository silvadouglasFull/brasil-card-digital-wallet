version: '3.8'

services:
  api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: brasilcard_api
      environment:
        DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
        JWT_SECRET: ${JWT_SECRET}
        PORT: 3000
      ports:
        - "3000:3000"
      depends_on:
        - db
      restart: always
      networks:
        - brasilcard_network
  db:
    image: postgres:15.15-trixie
    container_name: brasilcard_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - brasilcard_network
    restart: always

volumes:
  pgdata:

networks:
  brasilcard_network:
    driver: bridge